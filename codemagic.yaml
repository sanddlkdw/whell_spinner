workflows:
  build-android:
    name: Android Build
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      # 先用 flutter create 自动生成 android/ios 文件夹
      - flutter create --project-name wheel_spinner .
      # 然后构建
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
